# Vizdial configuration (hot-reloads automatically on save)

[window]
width = 840
height = 840
corner_radius = 28.0
# Frosted background opacity (0.0 = pure blur, 1.0 = solid card background)
bg_opacity = 0.42
border_opacity = 0.16
hover_hint = true

[audio]
# exact = mono-merged L/R mirrored & right half flipped 180 deg
# stereo = independent stereo channels mirrored & right half flipped 180 deg
mirror_mode = exact
source = auto
framerate = 120
# Used only when [zones] enabled = false
lower_cutoff_freq = 20
higher_cutoff_freq = 20000
tilt_db_per_oct = 1.50
db_range = 44.0
attack_ms = 2.0
decay_ms = 20.0
gain = 1.05
gamma = 0.90
sensitivity = 1.00

[zones]
# 5 configurable frequency zones (each zone maps logarithmically across its ray slice)
# Shares are relative weights auto-normalized across rays_per_wing.
enabled = true
zone_blend_rays = 10.0

# Zone 1: Sub-bass
zone1_min_hz = 20
zone1_max_hz = 100
zone1_share = 24.0
zone1_gain = 0.90
zone1_influence = 1.00
zone1_sensitivity = 0.55

# Zone 2: Bass
zone2_min_hz = 100
zone2_max_hz = 250
zone2_share = 24.0
zone2_gain = 0.45
zone2_influence = 0.55
zone2_sensitivity = 0.45

# Zone 3: Low Mids
zone3_min_hz = 250
zone3_max_hz = 1000
zone3_share = 22.0
zone3_gain = 0.25
zone3_influence = 0.55
zone3_sensitivity = 0.45

# Zone 4: High Mids
zone4_min_hz = 1000
zone4_max_hz = 6000
zone4_share = 20.0
zone4_gain = 0.15
zone4_influence = 0.55
zone4_sensitivity = 0.35

# Zone 5: Highs / Presence
zone5_min_hz = 6000
zone5_max_hz = 20000
zone5_share = 16.0
zone5_gain = 0.10
zone5_influence = 0.55
zone5_sensitivity = 0.20

[visual]
# Rays per wing (full circle = 2 * rays_per_wing)
rays_per_wing = 224
base_radius = 0.205
max_length = 0.250
ray_width_px = 2.2
ring_opacity = 0.22
tip_glow = 0.75

[colors]
# auto | monochrome | custom
mode = auto
bg_color = #131318
border_color = #bfc2ff
ring_color = #bfc2ff
ray_inner_color = #858ae3
ray_mid_color = #bfc2ff
ray_outer_color = #f2f2ff
